on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

      upload_url:
        required: true
        type: string

      release_ref:
        required: true
        type: string

      overwrite:
        required: true
        type: boolean

      release_name:
        required: false
        type: string
      
      release_body:
        required: false
        type: string

jobs:
  windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
      with:
        submodules: true

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Build release binary
      run: cargo build --verbose --locked --release

    - name: Create Release Archive
      shell: bash
      run: |
        mkdir staging
        cp "target/release/wally.exe" staging/
        cd staging
        7z a ../release.zip *

    - name: Upload Archive to Release
      uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ inputs.tag }}
        file: release.zip
        asset_name: wally-${{ inputs.release_ref }}-win64.zip
        overwrite: ${{ inputs.overwrite }}
        release_name: ${{ inputs.release_name }}
        body: ${{ inputs.release_body }}
        prerelease: true

  macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
      with:
        submodules: true

    - name: Install Rust
      run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Build release binary
      run: |
        source $HOME/.cargo/env
        cargo build --verbose --locked --release
      env:
        OPENSSL_STATIC: 1

    - name: Create Release Archive
      shell: bash
      run: |
        mkdir staging
        cp "target/release/wally" staging/
        cd staging
        zip ../release.zip *

    - name: Upload Archive to Release
      uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ inputs.tag }}
        file: release.zip
        asset_name: wally-${{ inputs.release_ref }}-macos.zip
        overwrite: ${{ inputs.overwrite }}
        release_name: ${{ inputs.release_name }}
        body: ${{ inputs.release_body }}
        prerelease: true

  linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
      with:
        submodules: true

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Build
      run: cargo build --locked --verbose --release
      env:
        OPENSSL_STATIC: 1

    - name: Create Release Archive
      shell: bash
      run: |
        mkdir staging
        cp "target/release/wally" staging/
        cd staging
        zip ../release.zip *

    - name: Upload Archive to Release
      uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ inputs.tag }}
        file: release.zip
        asset_name: wally-${{ inputs.release_ref }}-linux.zip
        overwrite: ${{ inputs.overwrite }}
        release_name: ${{ inputs.release_name }}
        body: ${{ inputs.release_body }}
        prerelease: true
